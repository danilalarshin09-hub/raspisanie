<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Расписание колледжа</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--text:#17233b;--muted:#718096;--line:#e5eaf2;--blue:#3678f6;--bluebg:#eaf2ff;--green:#e7f8ef;--yellow:#fff6d8;--shadow:0 8px 30px rgba(27,52,89,.07)
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}button,select,input{font:inherit}button{cursor:pointer;border:0}header{background:linear-gradient(120deg,#215bd8,#4b8bff);color:#fff;padding:24px clamp(16px,4vw,48px)}.head{max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:14px}.logo{height:46px;width:46px;border-radius:14px;background:#ffffff25;display:grid;place-items:center;font-size:23px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:#e1ecff;font-size:13px}.adminbtn{background:#fff;color:#235ed8;border-radius:10px;padding:10px 15px;font-weight:700}.wrap{max-width:1400px;margin:24px auto;padding:0 clamp(12px,3vw,32px)}.toolbar{background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:600}.field select,.search{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 12px;border-radius:10px;outline:0}.search{min-width:220px;flex:1}.search:focus,.field select:focus{border-color:#8db3ff;box-shadow:0 0 0 3px #eaf2ff}.weekbtn{padding:10px 15px;border-radius:10px;background:var(--bluebg);color:var(--blue);font-weight:700}.weekbtn.active{background:var(--blue);color:#fff}.status{margin:16px 0 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:14px}.day{background:var(--surface);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);min-height:220px}.dayhead{background:linear-gradient(120deg,#eaf1ff,#f1eaff);padding:13px 14px;font-weight:800;letter-spacing:.04em;font-size:13px;color:#345987}.daybody{padding:12px;display:grid;gap:10px} .lesson{border:1px solid var(--card-border,#cfe0ff);border-left:5px solid var(--card-accent,#3678f6);border-radius:14px;padding:13px;background:var(--card-bg,#eaf2ff);min-height:118px;box-shadow:0 3px 9px rgba(35,66,110,.06);transition:transform .15s,box-shadow .15s}.lesson:hover{transform:translateY(-2px);box-shadow:0 7px 16px rgba(35,66,110,.10)}.lesson.remote{background:#dff6e8;border-color:#a9dfbe;border-left-color:#24a765}.lesson.current{outline:2px solid #3678f6;box-shadow:0 0 0 3px #eaf2ff}.lesson .subject{color:var(--card-text,#234c83)}.time{font-size:12px;color:var(--blue);font-weight:800}.subject{font-weight:750;margin:5px 0}.details{font-size:12px;color:var(--muted);display:grid;gap:2px}.empty{padding:22px 10px;text-align:center;color:#9aa6b6;font-size:13px;background:#f8fafc;border-radius:10px}.notice{margin-top:16px;border:1px solid #dce8ff;background:#edf4ff;color:#486487;border-radius:12px;padding:12px 14px;font-size:13px}.footer{padding:24px;text-align:center;color:#97a2b2;font-size:12px}.modalback{position:fixed;inset:0;background:#14213b75;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}.modal{background:white;border-radius:18px;padding:22px;width:min(700px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 70px #0b1c3b40}.modal h2{margin:0 0 14px}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.modal label{display:grid;gap:5px;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary{background:var(--blue);color:white;padding:10px 15px;border-radius:10px;font-weight:700}.secondary{background:#eef2f7;color:#3e526f;padding:10px 15px;border-radius:10px}.danger{background:#fff0f0;color:#bb4545;padding:10px 15px;border-radius:10px}.list{display:grid;gap:8px;margin-top:14px}.listitem{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);padding:10px;border-radius:10px}.listitem small{color:var(--muted)}.hidden{display:none!important}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(200px,1fr))}}@media(max-width:720px){.head{align-items:flex-start}.brand h1{font-size:19px}.grid{grid-template-columns:1fr}.day{min-height:0}.search{min-width:100%}.modalgrid{grid-template-columns:1fr}.adminbtn{padding:9px 11px}}
</style>
<style id="layout-fix">
:root { --shadow: 0 8px 30px rgba(27,52,89,.07); }
body { background:#f3f6fc !important; font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif !important; color:#17233b !important; }
header { background:linear-gradient(120deg,#254fc7,#4c89ff) !important; }
.wrap { max-width:1600px !important; }
.toolbar { background:#fff !important; border-radius:18px !important; box-shadow:0 8px 24px rgba(35,66,110,.07) !important; }
.grid { display:grid !important; grid-template-columns:repeat(5,minmax(0,1fr)) !important; gap:14px !important; align-items:start !important; }
.day { background:#fff !important; border:1px solid #e2e8f3 !important; border-radius:16px !important; box-shadow:0 8px 22px rgba(35,66,110,.07) !important; overflow:hidden !important; }
.dayhead { background:linear-gradient(120deg,#e8f0ff,#f0eaff) !important; padding:14px !important; text-align:center !important; color:#315581 !important; }
.daybody { padding:11px !important; display:grid !important; gap:10px !important; }
.lesson { display:block !important; border:1px solid var(--card-border,#cfe0ff) !important; border-left:5px solid var(--card-accent,#3678f6) !important; border-radius:13px !important; background:var(--card-bg,#eaf2ff) !important; padding:13px !important; min-height:122px !important; box-shadow:0 3px 10px rgba(35,66,110,.06) !important; }
.lesson .subject { font-size:15px !important; font-weight:800 !important; color:var(--card-text,#234c83) !important; margin:7px 0 !important; }
.lesson .details { font-size:12px !important; line-height:1.4 !important; color:#53657c !important; }
.lesson.remote { background:#e1f6e8 !important; border-color:#a7dfbc !important; border-left-color:#28a766 !important; }
.lesson.current { outline:2px solid #3778f6 !important; box-shadow:0 0 0 4px #e5efff !important; }
@media(max-width:1200px){ .grid { grid-template-columns:repeat(3,minmax(0,1fr)) !important; } }
@media(max-width:800px){ .grid { grid-template-columns:repeat(2,minmax(0,1fr)) !important; } }
@media(max-width:560px){ .grid { grid-template-columns:1fr !important; } }
</style>

</head><body>
<header><div class="head"><div class="brand"><div class="logo">📚</div><div><h1>Расписание колледжа</h1><p>Чётная и нечётная недели · учебная сетка</p></div></div><button class="adminbtn" id="adminOpen">⚙ Администратор</button></div></header>
<main class="wrap"><section class="toolbar"><label class="field">Группа <select id="group"></select></label><button class="weekbtn active" id="odd">Нечётная неделя</button><button class="weekbtn" id="even">Чётная неделя</button><input class="search" id="search" placeholder="🔎 Поиск преподавателя или предмета"></section>
<div class="status"><span id="weeklabel">Нечётная неделя</span><span id="count"></span></div><section class="grid" id="schedule"></section>
<div class="notice">🕘 Первая пара начинается в 08:30. Продолжительность пары — 90 минут, перерыв — 10 минут. Текущая пара выделяется автоматически.</div></main><footer class="footer">Расписание колледжа · демо-версия</footer>
<div class="modalback" id="modal"><div class="modal" id="modalContent"></div></div>
<script>
const groups=[['ЭД-25-1','Эксплуатация железных дорог'],['ИТ-25-1','Информационные технологии'],['ТМ-25-1','Техническое машиностроение'],['ЛГ-25-1','Логистика и грузоперевозки'],['ЭЛ-25-1','Электротехника']];
const teachers=['Ирина Сергеевна Волкова','Андрей Павлович Миронов','Елена Викторовна Соколова','Дмитрий Олегович Крылов','Марина Алексеевна Белова','Сергей Николаевич Орлов','Наталья Игоревна Фёдорова','Алексей Романович Громов','Павел Андреевич Смирнов','Виктория Дмитриевна Лебедева','Максим Евгеньевич Захаров','Ольга Николаевна Кузнецова','Кирилл Михайлович Власов','Татьяна Юрьевна Морозова'];
const subjects=['Математика','Физика','Русский язык','Информатика','История','Основы железнодорожного транспорта','Английский язык','Электротехника','Техническая механика','География и логистика','Безопасность жизнедеятельности','Экономика','Программирование','Право'];
const days=['ПОНЕДЕЛЬНИК','ВТОРНИК','СРЕДА','ЧЕТВЕРГ','ПЯТНИЦА'];const times=['08:30–10:00','10:10–11:40','11:50–13:20','13:30–15:00','15:10–16:40','16:50–18:20'];
const rooms=['204','310','115','217','402','305','108','221','415','126'];
function seed(){let data={};groups.forEach((g,gi)=>{data[g[0]]={odd:{},even:{}};['odd','even'].forEach(week=>days.forEach((day,di)=>{let n=3+((gi+di+(week==='even'?1:0))%3);let arr=[];for(let k=0;k<n;k++){let si=(gi*3+di*2+k+(week==='even'?4:0))%subjects.length;arr.push({time:times[k],subject:subjects[si],teacher:teachers[(si+gi+di)%teachers.length],room:rooms[(gi*2+di+k)%rooms.length],remote:((gi+di+k)%9===0)});}data[g[0]][week][day]=arr;}));});return data}
let db=JSON.parse(localStorage.getItem('collegeSchedule')||'null')|| seed();let selected=groups[0][0],week='odd';const $=id=>document.getElementById(id);groups.forEach(g=>{let o=document.createElement('option');o.value=g[0];o.textContent=g[0]+' · '+g[1];$('group').append(o)});function save(){localStorage.setItem('collegeSchedule',JSON.stringify(db))}function nowPair(time){let [a,b]=time.split('–');const now=new Date(),mins=now.getHours()*60+now.getMinutes(),to=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};return mins>=to(a)&&mins<to(b)}const subjectColors={
'Математика':['#e4efff','#75a9ff','#245caa'],'Физика':['#ddf7e9','#78d0a0','#226b46'],'Русский язык':['#fff0df','#ffb976','#985b21'],'Информатика':['#e3f6dc','#9ed47d','#42752b'],'История':['#f0e4ff','#c39af2','#7142a3'],'Основы железнодорожного транспорта':['#ffe7d8','#ffad79','#a95e27'],'Английский язык':['#e5eaff','#a5b5ff','#475aa6'],'Электротехника':['#fff4d5','#f0c65c','#89691b'],'Техническая механика':['#ffe3e8','#f29db1','#9a4058'],'География и логистика':['#e1f5f5','#7cc9c7','#246c70'],'Безопасность жизнедеятельности':['#e4f4e7','#8bc9a0','#36734b'],'Экономика':['#e9e5ff','#b0a4ef','#5e52a4'],'Программирование':['#dff4ff','#7cc9f2','#246b92'],'Право':['#fbe4f5','#d88ac9','#914d82']};
function render(){let q=$('search').value.trim().toLowerCase(),html='',total=0;days.forEach(day=>{let lessons=(db[selected]?.[week]?.[day]||[]).filter(l=>!q||(l.subject+' '+l.teacher+' '+l.room).toLowerCase().includes(q));total+=lessons.length;html+=`<article class="day"><div class="dayhead">${day}</div><div class="daybody">`;if(!lessons.length)html+=`<div class="empty">${q?'Ничего не найдено':'Нет занятий'}</div>`;lessons.forEach(l=>{html+=`<div class="lesson ${l.remote?'remote':''} ${nowPair(l.time)?'current':''}" style="--card-bg:${(subjectColors[l.subject]||['#eaf2ff','#9bbcff','#3678f6'])[0]};--card-border:${(subjectColors[l.subject]||['#eaf2ff','#9bbcff','#3678f6'])[1]};--card-accent:${(subjectColors[l.subject]||['#eaf2ff','#9bbcff','#3678f6'])[1]};--card-text:${(subjectColors[l.subject]||['#eaf2ff','#9bbcff','#3678f6'])[2]}"><div class="time">${l.time}${l.remote?' · ДИСТАНТ':''}</div><div class="subject">${l.subject}</div><div class="details"><span>👤 ${l.teacher}</span><span>🚪 Каб. ${l.room}</span></div></div>`});html+='</div></article>'});$('schedule').innerHTML=html;$('weeklabel').textContent=week==='odd'?'Нечётная неделя':'Чётная неделя';$('count').textContent=`${total} занятий · ${groups.find(g=>g[0]===selected)[1]}`}function setWeek(w){week=w;$('odd').classList.toggle('active',w==='odd');$('even').classList.toggle('active',w==='even');render()}$('group').onchange=()=>{selected=$('group').value;render()};$('odd').onclick=()=>setWeek('odd');$('even').onclick=()=>setWeek('even');$('search').oninput=render;render();
function closeModal(){$('modal').style.display='none'}$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function openAdmin(){let pin=prompt('Введите PIN администратора (демо PIN: 2468)');if(pin!=='2468'){if(pin!==null)alert('Неверный PIN');return}showAdmin()}$('adminOpen').onclick=openAdmin;
function showAdmin(){let dayOpts=days.map(d=>`<option>${d}</option>`).join(''),gOpts=groups.map(g=>`<option value="${g[0]}">${g[0]}</option>`).join('');$('modalContent').innerHTML=`<h2>Панель администратора</h2><p style="color:#718096">Добавляй, удаляй или редактируй занятия выбранной группы, недели и дня. Изменения сохраняются в этом браузере.</p><div class="modalgrid"><label>Группа<select id="ag">${gOpts}</select></label><label>Неделя<select id="aw"><option value="odd">Нечётная</option><option value="even">Чётная</option></select></label><label>День<select id="ad">${dayOpts}</select></label><label>Время<select id="at">${times.map(t=>`<option>${t}</option>`).join('')}</select></label><label>Предмет<input id="as" placeholder="Например, Математика"></label><label>Преподаватель<input id="ate" placeholder="Фамилия Имя Отчество"></label><label>Кабинет<input id="ar" placeholder="204"></label><label style="align-content:center"><span><input type="checkbox" id="arem" style="width:auto"> Дистанционно</span></label></div><div class="actions"><button class="primary" id="addLesson">Добавить занятие</button><button class="secondary" id="closeAdmin">Закрыть</button></div><div class="list" id="adminList"></div>`;$('modal').style.display='flex';$('closeAdmin').onclick=closeModal;$('addLesson').onclick=()=>{let g=$('ag').value,w=$('aw').value,d=$('ad').value,s=$('as').value.trim(),t=$('ate').value.trim(),r=$('ar').value.trim();if(!s||!t||!r){alert('Заполни предмет, преподавателя и кабинет');return}db[g][w][d].push({time:$('at').value,subject:s,teacher:t,room:r,remote:$('arem').checked});db[g][w][d].sort((a,b)=>times.indexOf(a.time)-times.indexOf(b.time));save();render();showAdmin()};['ag','aw','ad'].forEach(id=>$(id).onchange=adminList);adminList()}
function adminList(){let g=$('ag').value,w=$('aw').value,d=$('ad').value,arr=db[g][w][d]||[];$('adminList').innerHTML=arr.map((l,i)=>`<div class="listitem"><div><b>${l.time} · ${l.subject}</b><br><small>${l.teacher} · каб. ${l.room}${l.remote?' · дистанционно':''}</small></div><button class="danger" data-del="${i}">Удалить</button></div>`).join('')||'<div class="empty">В этот день пока нет пар</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.del,1);save();render();adminList()})}
</script></body></html>
